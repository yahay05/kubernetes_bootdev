apiVersion: apps/v1
kind: Deployment
metadata:
    name: example-app
spec:
    selector:
        matchLabels:
            app: example-app
    template:
        metadata:
            labels:
                app: example-app
        spec:
            containers:
            - name: example-app
              image: <Image>
              resources:
                  limits:
                    memory: "128Mi"
                    cpu: "500m"
              ports:
                - containerPort: <Port>
